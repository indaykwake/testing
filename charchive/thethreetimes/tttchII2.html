<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Slider</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: black;
      overflow: hidden;
    }

    /* Container maintains ratio but scales to any screen */
    .slider-container {
      position: relative;
      width: 100%;
      max-width: 1600px;         /* full width on large screens */
      aspect-ratio: 32 / 15;     /* preserves 1600x750 ratio */
      overflow: hidden;
      background-color: black;
    }

    .slider {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.6s ease-in-out;
    }

    .slider img {
      width: 100%;
      height: 100%;
      flex-shrink: 0;
      object-fit: contain;       /* shows full image, scales responsively */
      background-color: black;   /* fills behind smaller images */
    }

    /* Navigation buttons */
    .buttons {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
      padding: 0 1rem;
    }

    .buttons.hidden {
      opacity: 0;
    }

    .buttons button {
      pointer-events: auto;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px 14px;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .buttons button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* Responsiveness tweaks */
    @media (max-width: 900px) {
      .buttons button {
        font-size: 1.2rem;
        padding: 8px 10px;
      }
    }

    @media (max-width: 600px) {
      .slider-container {
        aspect-ratio: auto;
        height: 60vh;
      }
    }
  </style>
</head>
<body>

  <div class="slider-container">
    <div class="slider" id="slider">
      <img src="2.11.png" alt="">
      <img src="2.12.png" alt="">
      <img src="2.13.png" alt="">
      <img src="2.14.png" alt="">
      <img src="2.15.png" alt="">

    </div>

    <div class="buttons" id="buttons">
      <button id="prev">&#9664;</button>
      <button id="next">&#9654;</button>
    </div>
  </div>

  <script>
    const slider = document.getElementById("slider");
    const slides = document.querySelectorAll(".slider img");
    const buttons = document.getElementById("buttons");
    let index = 0;
    let hideTimeout;

    function showSlide(i) {
      if (i < 0) i = slides.length - 1;
      if (i >= slides.length) i = 0;
      index = i;
      slider.style.transform = `translateX(-${index * 100}%)`; // ✅ percentage-based sliding
      resetButtonFade();
    }

    document.getElementById("next").addEventListener("click", () => showSlide(index + 1));
    document.getElementById("prev").addEventListener("click", () => showSlide(index - 1));

    // Touch swipe support
    let startX = 0;
    document.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      showButtons();
    });
    document.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) showSlide(index + 1);
      if (endX - startX > 50) showSlide(index - 1);
    });

    // Auto-hide buttons after inactivity
    document.addEventListener("mousemove", showButtons);
    document.addEventListener("touchstart", showButtons);

    function showButtons() {
      buttons.classList.remove("hidden");
      resetButtonFade();
    }

    function resetButtonFade() {
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => buttons.classList.add("hidden"), 2000);
    }

    resetButtonFade();
  </script>

</body>
</html>
