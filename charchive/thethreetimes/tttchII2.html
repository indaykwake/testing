<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1600x800 Horizontal Image Slider</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slider-container {
      position: relative;
      width: 100%;
      max-width: 1600px;  /* ✅ Limit to image width */
      aspect-ratio: 2 / 1; /* ✅ Keep 1600x800 ratio */
      overflow: hidden;
      background-color: black;
    }

    .slider {
      display: flex;
      transition: transform 0.6s ease-in-out;
      width: 100%;
      height: 100%;
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: contain;  /* ✅ Preserve full image (no crop) */
      object-position: center;
      flex-shrink: 0;
      background-color: black; /* Fill gaps */
      display: block;
    }

    /* Buttons */
    .buttons {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
      padding: 0 0.5cm;
    }

    .buttons.hidden {
      opacity: 0;
    }

    .buttons button {
      pointer-events: auto;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 1.3rem;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .buttons button:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    /* Responsive adjustments */
    @media (max-width: 1024px) {
      .slider-container {
        max-width: 100%;
        height: auto;
        aspect-ratio: 2 / 1;
      }

      .buttons button {
        padding: 8px 10px;
        font-size: 1.1rem;
      }
    }

    @media (orientation: portrait) {
      .slider img {
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

  <div class="slider-container">
    <div class="slider" id="slider">
      <img src="2.10.png" alt="">
      <img src="2.11.png" alt="">
      <img src="2.12.png" alt="">
      <img src="2.13.png" alt="">
      <img src="2.14.png" alt="">
    </div>

    <div class="buttons" id="buttons">
      <button id="prev">&#9664;</button>
      <button id="next">&#9654;</button>
    </div>
  </div>

  <script>
    const slider = document.getElementById("slider");
    const slides = document.querySelectorAll(".slider img");
    const buttons = document.getElementById("buttons");
    let index = 0;
    let hideTimeout;

    function showSlide(i) {
      if (i < 0) i = slides.length - 1;
      if (i >= slides.length) i = 0;
      index = i;
      slider.style.transform = `translateX(-${index * 100}%)`; // ✅ percentage-based
      resetButtonFade();
    }

    document.getElementById("next").addEventListener("click", () => showSlide(index + 1));
    document.getElementById("prev").addEventListener("click", () => showSlide(index - 1));

    // Swipe for mobile
    let startX = 0;
    document.addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
      showButtons();
    });
    document.addEventListener("touchend", e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) showSlide(index + 1);
      if (endX - startX > 50) showSlide(index - 1);
    });

    // Auto-hide buttons
    document.addEventListener("mousemove", showButtons);
    document.addEventListener("touchstart", showButtons);

    function showButtons() {
      buttons.classList.remove("hidden");
      resetButtonFade();
    }

    function resetButtonFade() {
      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => buttons.classList.add("hidden"), 2000);
    }

    resetButtonFade();
  </script>

</body>
</html>
